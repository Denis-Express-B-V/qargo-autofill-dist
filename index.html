<!-- One self-contained page: no external scripts, styles, fonts or images. make_release.sh fills in the public

<style>
  :root { --blue: #1565c0; --ink: #1a1a1a; --muted: #555; --soft: #f3f6fa; --line: #dde3ea; --stop: #b3261e; --stopbg: #fdf1f0; }
  * { box-sizing: border-box; }
  html { font-size: 16px; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; color: var(--ink);
         background: #fff; line-height: 1.55; }
  main { max-width: 720px; margin: 0 auto; padding: 2rem 1.25rem 4rem; }
  header { display: flex; align-items: center; gap: .75rem; }
  header svg { width: 36px; height: 36px; flex: none; }

  h2 { font-size: 1.1rem; margin: 2rem 0 .5rem; }
  h3 { font-size: 1rem; margin: 0 0 .3rem; }
  p { margin: .6rem 0; }
  button { font: inherit; cursor: pointer; }
  .langs { display: flex; gap: .35rem; flex-wrap: wrap; margin: 1rem 0 1.25rem; }
  .langs button, .os button { border: 1px solid var(--line); background: #fff; color: var(--ink); border-radius: 6px; }
  .langs button { font-size: .875rem; padding: .25rem .65rem; }
  .langs button[aria-pressed="true"], .os button[aria-pressed="true"] { border-color: var(--blue); background: var(--blue); color: #fff; }
  .os { display: flex; gap: .5rem; flex-wrap: wrap; }
  .os button { font-weight: 600; padding: .55rem 1.2rem; min-width: 9rem; border-radius: 8px; }
  ol.steps { list-style: none; counter-reset: step; padding: 0; margin: 1.25rem 0; }
  ol.steps > li { counter-increment: step; position: relative; padding: .9rem 0 .9rem 2.5rem; border-top: 1px solid var(--line); }
  ol.steps > li::before { content: counter(step); position: absolute; left: 0; top: .95rem; width: 1.6rem; height: 1.6rem;
         border-radius: 50%; background: var(--blue); color: #fff; font-weight: 600; font-size: .85rem; display: flex;
         align-items: center; justify-content: center; }
  kbd { font: inherit; font-size: .85em; border: 1px solid #c4c4c4; border-bottom-width: 2px; border-radius: 4px;
        padding: 0 .35em; background: #f7f7f7; white-space: nowrap; }
  .copy { display: inline-block; margin: .5rem 0; padding: .45rem 1rem; font-size: .95rem; font-weight: 600;
          color: #fff; background: var(--blue); border: 0; border-radius: 6px; }
  .copy:active { transform: translateY(1px); }
  .copy.done { background: #1b7f3b; }
  code.line { display: block; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .8rem; background: var(--soft);
          border: 1px solid var(--line); border-radius: 6px; padding: .5rem .65rem; overflow-wrap: anywhere; user-select: all; }
  .note { font-size: .925rem; color: var(--muted); margin: .5rem 0 0; }
  .stop { font-size: .925rem; background: var(--stopbg); border-left: 3px solid var(--stop); border-radius: 4px; padding: .5rem .8rem;
          margin: .6rem 0 0; }
  .box { border: 1px solid var(--line); border-radius: 8px; padding: .7rem .9rem; margin: .6rem 0; font-size: .95rem; }
  details { margin: .8rem 0; font-size: .925rem; }
  summary { cursor: pointer; font-weight: 600; padding: .3rem 0; }
  .warn { background: var(--stopbg); border-left: 3px solid var(--stop); border-radius: 4px; padding: .5rem .8rem; }
  [hidden] { display: none !important; }
</style>

  "m_stop": "<b>Спрете</b>, ако предупреждението е с друго заглавие (<b>“Malware Detected, Paste Blocked”</b> или <b>“Malicious Script Blocked”</b>) или няма бутон Paste Anyway, и се свържете с човека, който ви е изпратил тази страница.",
  "m3": "Натиснете <kbd>return</kbd> и изчакайте <b>Qargo Autofill is installed.</b> След това програмата се отваря и иконата ѝ се появява на работния плот. Можете да затворите Terminal.",
  "m_fail": "Ако Terminal покаже <b>Qargo Autofill could NOT be installed</b>, проверете връзката с интернет и изпълнете реда отново. Ако пак не стане, свържете се с човека, който ви е изпратил тази страница.",
  "w1": "Копирайте реда за инсталиране.",
  "w2": "Натиснете <kbd>⊞ Win</kbd> <kbd>R</kbd>, поставете реда с <kbd>Ctrl</kbd> <kbd>V</kbd> и натиснете <kbd>Enter</kbd>.",
  "w3": "Изчакайте <b>Qargo Autofill is installed.</b> След това програмата се отваря и иконата ѝ се появява на работния плот. Натиснете <kbd>Enter</kbd>, за да затворите прозореца.",
  "problem_title": "Ако нещо се обърка",
  "w_sac_title": "“Windows is blocking Qargo Autofill on this PC”",
  "w_sac_body": "Програмата е спряна от „Интелигентно управление на приложенията“ (Smart App Control) или от правило на организацията, която управлява компютъра; прозорецът казва кое от двете. Не променяйте настройки сами. Свържете се с човека, който ви е изпратил тази страница; дали програмата да бъде разрешена, решава собственикът на компютъра.",
  "w_sac_owner_title": "За собственика на компютъра",
  "w_sac_owner": "„Интелигентно управление на приложенията“ спира всяка програма, която Microsoft още не познава, и не позволява изключение за отделна програма. За да използвате Qargo Autofill, го изключете: Защита в Windows (Windows Security) → Управление на приложения и браузър (App &amp; browser control) → настройки на „Интелигентно управление на приложенията“ (Smart App Control settings) → Изкл. (Off), и изпълнете реда отново. Повторното включване по-късно не винаги е възможно без нулиране на Windows. В режим „Оценка“ (Evaluation) Windows може по-късно сам да го включи; тогава програмата спира да се стартира, а повторното изпълнение на реда обяснява защо.",
  "w_clm_title": "“Qargo Autofill can NOT be installed on this PC”",
  "w_clm_body": "Организацията, която управлява този компютър, не разрешава нови програми. Нищо не е променено. Свържете се с човека, който ви е изпратил тази страница.",
  "w_fail_title": "“Qargo Autofill could NOT be installed”",
  "w_fail_body": "Проверете връзката с интернет и изпълнете реда отново. Ако пак не стане, свържете се с човека, който ви е изпратил тази страница.",
  "next_title": "След инсталирането",
  "next_body": "Програмата се отваря в прозорец на браузър. Първия път влезте с обичайния си акаунт в Qargo.",
  "helper_title": "Технически подробности и премахване",
  "helper_does": "Редът инсталира програмата във вашата потребителска папка и добавя икона на работния плот. Не изисква администраторски права и не променя системни настройки. Програмата се обновява сама.",
  "helper_where": "Папка:",
  "helper_remove": "За да премахнете програмата (документите и входът се запазват), изпълнете този ред по същия начин:"
 }

</script>
<script>
(function () {
  "use strict";
  var BASE = "https://raw.githubusercontent.com/cagataysunal/qargo-autofill-dist/main";                       // make_release.sh fills in the public address
  // The link that was sent ends in #s=<site code> (and maybe &<language>): the id of the secret gist with the site
  // profile. Only hex digits get into a line that is pasted into a shell.
  var HASH = (location.hash || "").replace("#", "").split(/[&,;]/);
  var SITE = "", HASH_LANG = "";
  HASH.forEach(function (part) {
    var m = /^s=([0-9a-f]{20,40})$/.exec(part);
    if (m) SITE = m[1]; else if (part) HASH_LANG = part;
  });
  var LINES = {
    mac: "curl -fsSL " + BASE + "/install-macos.sh | QARGO_SITE=" + SITE + " bash",
    // try/catch: if the download of the installer itself fails, the window says so and waits instead of closing at once
    win: 'powershell -nop -exec Bypass -Command "$env:QARGO_SITE=\'' + SITE + '\';try{irm ' + BASE + '/install-windows.ps1|iex}catch{Write-Host $_;Read-Host \'Not installed. Press Enter\'}"',
    mac_rm: "curl -fsSL " + BASE + "/uninstall-macos.sh | bash",
    win_rm: 'powershell -NoProfile -ExecutionPolicy Bypass -Command "try{irm ' + BASE + '/uninstall-windows.ps1|iex}catch{Write-Host $_;Read-Host \'Press Enter to close\'}"'
  };
  var WHERE = { mac: "~/Library/Application Support/QargoAutofill", win: "%LOCALAPPDATA%\\QargoAutofill" };
  var T = JSON.parse(document.getElementById("strings").textContent);
  var lang = "en", os = "";

  function remembered(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }
  function remember(key, value) { try { localStorage.setItem(key, value); } catch (e) { /* private window */ } }

  function detectOs() {
    var ua = navigator.userAgent || "", p = navigator.platform || "";
    if (/Android|iPhone|iPad|iPod/i.test(ua) || (/Mac/i.test(p) && navigator.maxTouchPoints > 1)) return "";   // phone or tablet
    if (/Mac/i.test(p) || /Macintosh/i.test(ua)) return "mac";
    if (/Win/i.test(p) || /Windows/i.test(ua)) return "win";
    return "";
  }

  function line(kind) { return kind === "rm" ? LINES[(os || "mac") + "_rm"] : LINES[kind]; }

  function render() {
    var t = T[lang];
    document.documentElement.lang = lang;
    document.title = t.title;
    Array.prototype.forEach.call(document.querySelectorAll("[data-t]"), function (el) {
      var text = t[el.getAttribute("data-t")];
      if (el.classList.contains("copy") && el.classList.contains("done")) text = t.copied;
      el.innerHTML = text;                                 // the table is ours; it holds <b> and <kbd> on purpose
      if (el.classList.contains("note")) el.hidden = !text || el.id === "other" && !!os;
    });
    Array.prototype.forEach.call(document.querySelectorAll("[data-lang]"), function (b) {
      b.setAttribute("aria-pressed", String(b.getAttribute("data-lang") === lang));
    });
    Array.prototype.forEach.call(document.querySelectorAll("[data-os]"), function (b) {
      b.setAttribute("aria-pressed", String(b.getAttribute("data-os") === os));
    });
    Array.prototype.forEach.call(document.querySelectorAll("[data-line]"), function (el) {
      el.textContent = line(el.getAttribute("data-line"));
    });
    document.getElementById("mac").hidden = os !== "mac" || !SITE;
    document.getElementById("win").hidden = os !== "win" || !SITE;
    document.getElementById("after").hidden = !os;
    document.getElementById("other").hidden = !!os;
    document.getElementById("where").textContent = WHERE[os] || "";
    document.getElementById("unstamped").hidden = BASE.indexOf("://") > 0;
    document.getElementById("nosite").hidden = !!SITE;
  }

  function copy(button) {
    var text = line(button.getAttribute("data-copy"));
    function done(ok) {
      if (!ok) { window.alert(T[lang].copy_failed); return; }
      button.classList.add("done");
      button.innerHTML = T[lang].copied;
      setTimeout(function () { button.classList.remove("done"); button.innerHTML = T[lang].copy; }, 6000);
    }
    function oldWay() {                                    // pages opened from a file, old browsers
      var area = document.createElement("textarea");
      area.value = text;
      area.setAttribute("readonly", "");
      area.style.position = "fixed";
      area.style.opacity = "0";
      document.body.appendChild(area);
      area.select();
      var ok = false;
      try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
      document.body.removeChild(area);
      done(ok);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { done(true); }, oldWay);
    } else {
      oldWay();
    }
  }

  document.addEventListener("click", function (ev) {
    var b = ev.target.closest ? ev.target.closest("button") : null;
    if (!b) return;
    if (b.hasAttribute("data-lang")) { lang = b.getAttribute("data-lang"); remember("qargo-lang", lang); render(); }
    else if (b.hasAttribute("data-os")) { os = b.getAttribute("data-os"); render(); }
    else if (b.hasAttribute("data-copy")) { copy(b); }
  });

  var wanted = HASH_LANG || remembered("qargo-lang");
  if (!wanted) {                                           // the language of the reader's own computer, when we have it
    var prefs = navigator.languages || [navigator.language || ""];
    for (var i = 0; i < prefs.length && !wanted; i++) { var two = String(prefs[i]).slice(0, 2).toLowerCase(); if (T[two]) wanted = two; }
  }
  if (wanted && T[wanted]) lang = wanted;                  // else English
  os = detectOs();
  render();
})();
</script>
